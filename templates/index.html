<!DOCTYPE html>
<html>
<head>
<title>DeniTracker 2</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
<h1 class="fw-bold">DeniTracker 2</h1>
<div class="card bg-dark text-white p-4 mb-4">
<h2>Total Deni: KES {{ total_deni }}</h2>
<p class="mb-0">You have {{ customers|length }} customers with debt</p>
</div>
<a href="/add_customer" class="btn btn-success mb-3">+ Add Customer</a>
{% for c in customers %}
<div class="card p-3 mb-2 d-flex flex-row justify-content-between">
<div><b>{{ c.name }}</b> <span class="text-muted">{{ c.phone }}</span></div>
<a href="/customer/{{ c.id }}" class="btn btn-primary btn-sm">View →</a>
</div>
{% else %}
<div class="card p-3">No customers yet.</div>
{% endfor %}
</div>
</body>
</html>
